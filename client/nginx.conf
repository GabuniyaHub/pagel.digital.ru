server {
    listen 80;
    server_name pagel-digital.ru www.pagel-digital.ru;

    root /usr/share/nginx/html;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # Admin proxy
    location /admin/ {
        root /usr/share/nginx/admin;
        index index.html;
        try_files $uri /index.html;
    }

    # API proxy
    location ~ ^/(api|market|account|settings|uploads|client|pages|auth) {
        client_max_body_size 5M;
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pagel-digital.ru www.pagel-digital.ru;

    ssl_certificate     /etc/letsencrypt/live/pagel-digital.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pagel-digital.ru/privkey.pem;

    root /usr/share/nginx/html/pages;
    index index.html;

    # Admin proxy
    location /admin/ {
        root /usr/share/nginx/admin;
        index index.html;
        try_files $uri /index.html;
    }

    # API proxy
    location ~ ^/(api|market|account|settings|uploads|client|pages|auth) {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}