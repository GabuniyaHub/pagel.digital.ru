<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Страница не найдена</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #eaeaea;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            text-align: center;
            padding: 40px;
            max-width: 520px;
        }
        .code {
            font-size: 96px;
            font-weight: 800;
            letter-spacing: -4px;
            background: linear-gradient(135deg, #4f8cff, #9b5cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 12px;
        }
        p {
            color: #a0a0a0;
            margin: 0 0 28px;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f8cff, #9b5cff);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: opacity .2s;
        }
        a:hover { opacity: .85; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <h1>Страница не найдена</h1>
        <p>Возможно, она была удалена, переименована или вы ошиблись в адресе.</p>
        <a href="/">Вернуться на главную</a>
    </div>
</body>
</html>
